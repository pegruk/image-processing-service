services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_service}
      POSTGRES_USER: ${POSTGRES_USER:-image_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-image_service}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-image_service} -d ${POSTGRES_DB:-image_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-image_service}:${POSTGRES_PASSWORD:-image_service}@postgres:5432/${POSTGRES_DB:-image_service}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env or the deployment environment}
      JWT_ISSUER: ${JWT_ISSUER:-image-processing-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-image-processing-client}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      STORAGE_ROOT: /app/storage
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      MAX_IMAGE_WIDTH: ${MAX_IMAGE_WIDTH:-10000}
      MAX_IMAGE_HEIGHT: ${MAX_IMAGE_HEIGHT:-10000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MAX_STORAGE_BYTES_PER_USER: ${MAX_STORAGE_BYTES_PER_USER:-524288000}
      MAX_CONCURRENT_TRANSFORMS: ${MAX_CONCURRENT_TRANSFORMS:-2}
      DRIZZLE_MIGRATIONS_DIR: /app/drizzle
    ports:
      - "3000:3000"
    volumes:
      - image_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  image_storage:
