name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: image_service
          POSTGRES_USER: image_service
          POSTGRES_PASSWORD: image_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U image_service -d image_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://image_service:image_service@localhost:5432/image_service
          JWT_SECRET: ci-secret-with-at-least-32-characters

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
